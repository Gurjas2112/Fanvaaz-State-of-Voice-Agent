name: quality-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  offline-gates:
    name: Lint, unit, metamorphic, golden, API, safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not e2e and not mobile and not llm" --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: offline-reports, path: reports/ }

  live-api:
    name: Newman, Schemathesis, promptfoo, k6 (live server)
    runs-on: ubuntu-latest
    needs: offline-gates
    env:
      ATOMPULSE_DB_PATH: ${{ github.workspace }}/data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[fuzz]"
      - name: Seed and start the API
        run: |
          atompulse run --source demo
          nohup atompulse serve --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Postman collection (Newman)
        run: npx --yes newman run postman/AtomPulse.postman_collection.json -e postman/local.postman_environment.json
      - name: Schemathesis contract fuzzing
        run: schemathesis run http://127.0.0.1:8000/openapi.json --checks all --max-examples 60 --exclude-path /api/v1/runs
      - name: promptfoo behavioural and refusal checks
        env: { PROMPTFOO_DISABLE_TELEMETRY: "1" }
        run: npx --yes promptfoo@latest eval -c promptfoo/promptfooconfig.yaml --no-progress-bar -o reports/promptfoo.json
      - uses: grafana/setup-k6-action@v1
      - name: k6 load test
        run: k6 run --summary-export reports/k6_summary.json load/k6_sov.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-api-reports, path: "reports/\nserver.log" }

  e2e-web:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: offline-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]" && python -m playwright install --with-deps chromium
      - run: pytest -m e2e --tracing retain-on-failure --screenshot only-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: test-results/ }

  mobile-appium:
    name: Appium on Android emulator
    runs-on: ubuntu-latest
    needs: offline-gates
    env:
      ATOMPULSE_DB_PATH: ${{ github.workspace }}/data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install -e ".[dev,mobile]"
      - name: Install Appium
        run: npm install -g appium && appium driver install uiautomator2
      - name: Seed and start the API
        run: |
          atompulse run --source demo
          nohup atompulse serve --host 0.0.0.0 --port 8000 > server.log 2>&1 &
      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            nohup appium --allow-insecure chromedriver_autodownload > appium.log 2>&1 &
            sleep 10
            APPIUM_URL=http://127.0.0.1:4723 APP_URL=http://10.0.2.2:8000 pytest -m mobile -v
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: appium-logs, path: "appium.log\nserver.log" }

  llm-evals:
    name: DeepEval + Ragas (only when an LLM key secret exists)
    runs-on: ubuntu-latest
    needs: offline-gates
    if: ${{ vars.RUN_LLM_EVALS == 'true' }}
    env:
      ATOMPULSE_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      ATOMPULSE_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      ATOMPULSE_LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev,llm-evals]"
      - run: pytest -m llm -v
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: llm-eval-reports, path: reports/ }

  docker:
    name: Docker build + smoke
    runs-on: ubuntu-latest
    needs: offline-gates
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atompulse:ci .
      - run: |
          docker run -d -p 8000:8000 --name ap atompulse:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs ap; exit 1
