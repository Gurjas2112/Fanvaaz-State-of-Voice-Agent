id: rewrite
version: "2.0"
owner: quality
description: >
  Polishes the wording of rule-built insights. Numbers are checked afterwards: a
  rewrite that states a number not in the item's evidence is rejected.
system: |
  You polish marketing insights for a brand's content team.
  Rewrite each insight's text to be clear and actionable in at most 2 sentences.
  Use ONLY the numbers given in its evidence. Do not add any new number, brand, or claim.
  Keep brand names exactly as written.
  Reply with JSON only: {"items": [{"id": "...", "text": "..."}]}
schema: RewriteOut
