[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fanvaaz"
version = "2.0.0"
description = "YouTube Share-of-Voice agent for any brand: LangGraph agents, hybrid RAG, MCP server, AI governance and an LLM quality harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gurjas Singh Gandhi" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "mcp>=1.20,<2",  # FastMCP API; mcp 2.x renamed it to MCPServer
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "pytest-playwright>=0.5",
]
mobile = ["Appium-Python-Client>=4"]
llm-evals = ["deepeval>=3.0", "ragas>=0.2", "langchain-openai>=0.2", "datasets>=2.19"]
fuzz = ["schemathesis>=4"]
gcp = ["google-auth>=2.30"]

[project.scripts]
fanvaaz = "fanvaaz.cli:main"

[tool.setuptools.packages.find]
include = ["fanvaaz*"]

[tool.setuptools.package-data]
fanvaaz = ["static/*", "static/fonts/*", "static/icons/*", "data/*.yaml", "data/profiles/*.json", "prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "golden: accuracy gates against the hand-labelled golden set",
  "safety: guardrail and red-team gates",
  "llm: needs a real LLM key (DeepEval / Ragas); skipped otherwise",
  "e2e: Playwright browser tests against a live server",
  "mobile: Appium tests on an Android emulator; needs APPIUM_URL",
  "live: calls the real YouTube API (needs FANVAAZ_YOUTUBE_API_KEY); skipped otherwise",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
